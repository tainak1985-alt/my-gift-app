<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRKT Style Gifts</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bg-color: #0e1621;
            --card-bg: #17212b;
            --text-primary: #ffffff;
            --text-secondary: #7f91a4;
            --accent-blue: #2b72d8;
            --border-color: rgba(255, 255, 255, 0.07);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 12px;
            padding-bottom: 90px;
            user-select: none;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            margin: 4px 0 14px 4px;
            letter-spacing: -0.4px;
        }

        .gifts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        /* Карточка MRKT Style */
        .mrkt-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .mrkt-card:active {
            transform: scale(0.96);
        }

        /* Медиа-контейнер для NFT */
        .mrkt-media {
            width: 100%;
            aspect-ratio: 1 / 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Динамический фоновый паттерн MRKT */
        .mrkt-pattern {
            position: absolute;
            inset: 0;
            background-size: 32px 32px;
            background-repeat: repeat;
            opacity: 0.12;
            transform: rotate(-12deg) scale(1.2);
            pointer-events: none;
        }

        /* Картинка / Модель с Spring-анимацией */
        .mrkt-image {
            width: 75%;
            height: 75%;
            object-fit: contain;
            z-index: 2;
            filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.45));
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .mrkt-card:active .mrkt-image {
            transform: scale(1.12) rotate(-2deg);
        }

        /* Плашки сверху карточки */
        .badge-num {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 7px;
            border-radius: 8px;
            z-index: 3;
        }

        .badge-price {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(43, 114, 216, 0.85);
            backdrop-filter: blur(6px);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 8px;
            z-index: 3;
        }

        .mrkt-info {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .mrkt-title {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mrkt-sub {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Bottom Sheet в стиле Telegram MRKT */
        .sheet-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .sheet-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .sheet-content {
            width: 100%;
            max-width: 500px;
            background: #17212b;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 12px 16px 24px 16px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            border-top: 1px solid var(--border-color);
        }

        .sheet-overlay.active .sheet-content {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 36px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin: 0 auto 16px auto;
        }

        .sheet-preview {
            width: 130px;
            height: 130px;
            margin: 0 auto 14px auto;
            border-radius: 18px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .sheet-preview img {
            width: 80%;
            height: 80%;
            object-fit: contain;
            z-index: 2;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.5));
            animation: mrktPulse 2.5s ease-in-out infinite;
        }

        @keyframes mrktPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        .sheet-title {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            margin: 0;
        }

        .sheet-collection {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            margin: 2px 0 16px 0;
        }

        /* Сетка свойств NFT (Attributes Grid) */
        .attributes-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .attr-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .attr-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .attr-value {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-buy {
            width: 100%;
            background: #2b72d8;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            box-shadow: 0 4px 12px rgba(43, 114, 216, 0.3);
        }

        .btn-buy:active {
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="header-title">NFT Подарки (MRKT)</div>
    <div class="gifts-grid" id="gifts-container"></div>

    <!-- Всплывающее окно карточки -->
    <div class="sheet-overlay" id="sheet-modal" onclick="closeSheet(event)">
        <div class="sheet-content">
            <div class="sheet-handle"></div>
            
            <div class="sheet-preview" id="modal-preview">
                <div class="mrkt-pattern" id="modal-pattern"></div>
                <img id="modal-img" src="" alt="Gift">
            </div>

            <h3 class="sheet-title" id="modal-title">Name</h3>
            <div class="sheet-collection" id="modal-collection">Collection</div>

            <div class="attributes-grid">
                <div class="attr-box">
                    <span class="attr-label">Модель</span>
                    <span class="attr-value" id="modal-model">-</span>
                </div>
                <div class="attr-box">
                    <span class="attr-label">Фон</span>
                    <span class="attr-value" id="modal-backdrop">-</span>
                </div>
                <div class="attr-box">
                    <span class="attr-label">Символ</span>
                    <span class="attr-value" id="modal-symbol">-</span>
                </div>
                <div class="attr-box">
                    <span class="attr-label">Номер</span>
                    <span class="attr-value" id="modal-number">-</span>
                </div>
            </div>

            <a href="#" target="_blank" class="btn-buy" id="modal-btn">Купить на MRKT</a>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // База подарков со всеми атрибутами
        const giftsData = [
            {
                name: "Freddy Monkey",
                collection: "FCK CLUB",
                number: "1024",
                model: "Freddy Wolverine",
                backdrop: "Dark Gradient",
                symbol: "FCK Emblem",
                bgGradient: "radial-gradient(circle, #2d2d2d 0%, #111111 100%)",
                patternSvg: "url('data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"white\"><path d=\"M12 2L15 9H22L16 14L18 21L12 17L6 21L8 14L2 9H9L12 2Z\"/></svg>')",
                image: "https://i.postimg.cc/mD8N0x5G/monkey-freddy.png",
                price: "250 TON",
                link: "https://t.me/mrkt"
            },
            {
                name: "Plush Pepe",
                collection: "Pepe Gifts",
                number: "788",
                model: "Golden Frog",
                backdrop: "Emerald Sparkle",
                symbol: "Pepe Mask",
                bgGradient: "radial-gradient(circle, #059669 0%, #022c22 100%)",
                patternSvg: "url('data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"white\"><circle cx=\"12\" cy=\"12\" r=\"8\"/></svg>')",
                image: "https://cdn-icons-png.flaticon.com/512/4213/4213641.png",
                price: "180 TON",
                link: "https://t.me/mrkt"
            },
            {
                name: "Durov Cap",
                collection: "Telegram Originals",
                number: "1",
                model: "Black Cap",
                backdrop: "Midnight Sky",
                symbol: "Telegram Star",
                bgGradient: "radial-gradient(circle, #1e293b 0%, #020617 100%)",
                patternSvg: "url('data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"white\"><polygon points=\"12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9\"/></svg>')",
                image: "https://cdn-icons-png.flaticon.com/512/3345/3345380.png",
                price: "1200 TON",
                link: "https://t.me/mrkt"
            },
            {
                name: "Cyber Skull",
                collection: "Electric Skulls",
                number: "404",
                model: "Neon Skeleton",
                backdrop: "Cyber Cyan",
                symbol: "Lightning",
                bgGradient: "radial-gradient(circle, #0891b2 0%, #083344 100%)",
                patternSvg: "url('data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"white\"><polygon points=\"13,2 3,14 12,14 11,22 21,10 12,10\"/></svg>')",
                image: "https://cdn-icons-png.flaticon.com/512/1162/1162981.png",
                price: "310 TON",
                link: "https://t.me/mrkt"
            }
        ];

        function renderGifts() {
            const container = document.getElementById('gifts-container');
            container.innerHTML = '';

            giftsData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'mrkt-card';
                card.onclick = () => openSheet(item);

                card.innerHTML = `
                    <div class="mrkt-media" style="background: ${item.bgGradient}">
                        <div class="mrkt-pattern" style="background-image: ${item.patternSvg}"></div>
                        <div class="badge-num">#${item.number}</div>
                        <div class="badge-price">${item.price}</div>
                        <img src="${item.image}" class="mrkt-image" alt="${item.name}">
                    </div>
                    <div class="mrkt-info">
                        <div class="mrkt-title">${item.name}</div>
                        <div class="mrkt-sub">${item.collection}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openSheet(item) {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }

            document.getElementById('modal-preview').style.background = item.bgGradient;
            document.getElementById('modal-pattern').style.backgroundImage = item.patternSvg;
            document.getElementById('modal-img').src = item.image;
            document.getElementById('modal-title').innerText = item.name;
            document.getElementById('modal-collection').innerText = item.collection + " • #" + item.number;

            document.getElementById('modal-model').innerText = item.model;
            document.getElementById('modal-backdrop').innerText = item.backdrop;
            document.getElementById('modal-symbol').innerText = item.symbol;
            document.getElementById('modal-number').innerText = "#" + item.number;

            document.getElementById('modal-btn').innerText = "Купить за " + item.price;
            document.getElementById('modal-btn').href = item.link;

            document.getElementById('sheet-modal').classList.add('active');
        }

        function closeSheet(event) {
            if (event.target.id === 'sheet-modal' || event.target.className === 'sheet-handle') {
                document.getElementById('sheet-modal').classList.remove('active');
            }
        }

        renderGifts();
    </script>
</body>
</html>
