<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TON Gifts 3D Explorer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- 3D Viewer библиотека для отображения интерактива -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top, #0b192c 0%, #030712 100%);
            --glass-bg: rgba(14, 30, 55, 0.6);
            --glass-border: rgba(56, 189, 248, 0.35);
            --neon-sky: #38bdf8;
            --neon-glow: 0 0 16px rgba(56, 189, 248, 0.45);
            --text-main: #f0f9ff;
            --text-sub: #93c5fd;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            padding-bottom: 95px;
            box-sizing: border-box;
            min-height: 100vh;
        }

        .header {
            margin-bottom: 16px;
        }

        .title {
            font-size: 22px;
            font-weight: 800;
            margin: 0;
            color: #ffffff;
            text-shadow: var(--neon-glow);
        }

        .page { display: none; }
        .page.active { display: block; }

        /* Фильтры времени */
        .filter-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 16px;
            scrollbar-width: none;
        }
        .filter-scroll::-webkit-scrollbar { display: none; }

        .filter-chip {
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            color: var(--text-sub);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-chip.active {
            background: rgba(56, 189, 248, 0.22);
            border-color: var(--neon-sky);
            color: #ffffff;
            box-shadow: var(--neon-glow);
        }

        /* Карточка с 3D моделями */
        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 22px;
            padding: 16px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        /* Виджет 3D Подарка */
        .viewer-3d-box {
            width: 100%;
            height: 200px;
            border-radius: 16px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(0, 0, 0, 0.2) 100%);
            border: 1px solid rgba(56, 189, 248, 0.2);
            margin-bottom: 12px;
            overflow: hidden;
            position: relative;
        }

        model-viewer {
            width: 100%;
            height: 100%;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px;
            border-radius: 12px;
            font-size: 12px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            color: var(--text-sub);
            font-size: 11px;
        }

        .detail-value {
            font-weight: 700;
            color: #ffffff;
        }

        .platform-tag {
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }
        .tag-mrkt { background: rgba(234, 179, 8, 0.2); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.3); }
        .tag-portals { background: rgba(168, 85, 247, 0.2); color: #e9d5ff; border: 1px solid rgba(168, 85, 247, 0.3); }
        .tag-tunnel { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.3); }

        .price-badge {
            font-size: 18px;
            font-weight: 800;
            color: var(--neon-sky);
            text-shadow: var(--neon-glow);
        }

        .btn-soft-neon {
            display: block;
            text-align: center;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid var(--neon-sky);
            color: #ffffff;
            padding: 12px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            margin-top: 12px;
            box-shadow: var(--neon-glow);
            transition: all 0.2s ease;
        }

        .btn-soft-neon:active {
            background: rgba(56, 189, 248, 0.3);
            transform: scale(0.98);
        }

        /* Профиль */
        .profile-box { text-align: center; padding: 24px 16px; }
        .avatar {
            width: 80px; height: 80px; border-radius: 50%;
            background: rgba(56, 189, 248, 0.15);
            border: 2px solid var(--neon-sky);
            box-shadow: var(--neon-glow);
            margin: 0 auto 12px auto;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: bold; color: var(--neon-sky);
        }

        /* Нижнее прозрачное меню */
        .bottom-nav {
            position: fixed;
            bottom: 12px;
            left: 16px;
            right: 16px;
            height: 64px;
            background: rgba(11, 25, 44, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            z-index: 1000;
        }

        .nav-btn {
            background: none; border: none;
            color: var(--text-sub);
            font-size: 11px;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            cursor: pointer; width: 33%;
            transition: all 0.3s ease;
        }

        .nav-btn.active {
            color: var(--neon-sky);
            font-weight: 700;
            text-shadow: var(--neon-glow);
        }
    </style>
</head>
<body>

    <!-- Вкладка 1: Все Маркетплейсы -->
    <div id="page-market" class="page active">
        <div class="header">
            <h1 class="title">🛒 Торговые Площадки</h1>
        </div>
        <div class="feed-container" id="market-list">
            <!-- Динамическая загрузка токенов -->
        </div>
    </div>

    <!-- Вкладка 2: Улучшенные подарки -->
    <div id="page-upgrades" class="page">
        <div class="header">
            <h1 class="title">⚡️ История Апгрейдов</h1>
        </div>

        <div class="filter-scroll">
            <button class="filter-chip active" onclick="filterUpgrades('now', this)">⚡️ Только что</button>
            <button class="filter-chip" onclick="filterUpgrades('week', this)">📅 Неделю назад</button>
            <button class="filter-chip" onclick="filterUpgrades('month', this)">🗓 Месяц назад</button>
            <button class="filter-chip" onclick="filterUpgrades('year', this)">⏳ Год назад</button>
        </div>

        <div class="feed-container" id="upgrades-list"></div>
    </div>

    <!-- Вкладка 3: Профиль -->
    <div id="page-profile" class="page">
        <div class="header"><h1 class="title">👤 Профиль</h1></div>
        <div class="glass-card profile-box">
            <div class="avatar" id="user-avatar">?</div>
            <h2 id="user-name" style="margin: 0 0 6px 0; font-size: 20px;">Пользователь</h2>
            <p id="user-id" style="color: var(--text-sub); margin: 0; font-size: 13px;"></p>
        </div>
    </div>

    <!-- Навигация -->
    <div class="bottom-nav">
        <button class="nav-btn active" onclick="switchPage('market', this)">
            <span style="font-size:20px;">🛍</span>
            <span>Маркеты</span>
        </button>
        <button class="nav-btn" onclick="switchPage('upgrades', this)">
            <span style="font-size:20px;">⚡️</span>
            <span>Апгрейды</span>
        </button>
        <button class="nav-btn" onclick="switchPage('profile', this)">
            <span style="font-size:20px;">👤</span>
            <span>Профиль</span>
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('user-name').innerText = user.first_name + (user.last_name ? ' ' + user.last_name : '');
            document.getElementById('user-id').innerText = 'ID: ' + user.id;
            document.getElementById('user-avatar').innerText = user.first_name.charAt(0).toUpperCase();
        }

        // Пример данных с 3D-моделями подарков (.glb) и полными атрибутами
        const marketGifts = [
            {
                name: "Plush Bear",
                collection: "Telegram Gifts",
                number: "1024",
                symbol: "🧸",
                backdrop: "Cyan Soft Neon",
                price: "145 TON",
                platform: "MRKT",
                platformClass: "tag-mrkt",
                model3d: "https://modelviewer.dev/shared-assets/models/Astronaut.glb",
                link: "https://t.me/mrkt"
            },
            {
                name: "Sparks",
                collection: "Telegram Gifts",
                number: "512",
                symbol: "✨",
                backdrop: "Deep Blue Space",
                price: "89 TON",
                platform: "Portals",
                platformClass: "tag-portals",
                model3d: "https://modelviewer.dev/shared-assets/models/glTF-Sample-Assets/Models/MaterialsVariantsShoe/glTF-Binary/MaterialsVariantsShoe.glb",
                link: "https://t.me/portals"
            },
            {
                name: "Red Star",
                collection: "Telegram Gifts",
                number: "42",
                symbol: "⭐",
                backdrop: "Golden Glow",
                price: "320 TON",
                platform: "Tunnel",
                platformClass: "tag-tunnel",
                model3d: "https://modelviewer.dev/shared-assets/models/Astronaut.glb",
                link: "https://t.me/tunnel"
            }
        ];

        function renderMarket() {
            const container = document.getElementById('market-list');
            container.innerHTML = '';

            marketGifts.forEach(item => {
                const card = document.createElement('div');
                card.className = 'glass-card';
                card.innerHTML = `
                    <div class="viewer-3d-box">
                        <model-viewer src="${item.model3d}" auto-rotate camera-controls touch-action="pan-y" shadow-intensity="1" alt="3D Gift"></model-viewer>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <span style="font-size: 18px; font-weight: 800;">${item.symbol} ${item.name}</span>
                            <span class="platform-tag ${item.platformClass}" style="margin-left: 6px;">${item.platform}</span>
                        </div>
                        <div class="price-badge">${item.price}</div>
                    </div>
                    <div class="details-grid">
                        <div class="detail-item"><span class="detail-label">Коллекция:</span><span class="detail-value">${item.collection}</span></div>
                        <div class="detail-item"><span class="detail-label">Номер подарка:</span><span class="detail-value">#${item.number}</span></div>
                        <div class="detail-item"><span class="detail-label">Фон:</span><span class="detail-value">${item.backdrop}</span></div>
                        <div class="detail-item"><span class="detail-label">Символ:</span><span class="detail-value">${item.symbol}</span></div>
                    </div>
                    <a href="${item.link}" target="_blank" class="btn-soft-neon">Купить на ${item.platform}</a>
                `;
                container.appendChild(card);
            });
        }

        const upgradeData = {
            now: [
                { name: "Cyber Skull", collection: "TG Gifts", number: "77", symbol: "💀", backdrop: "Electric Cyan", owner: "@durov", model3d: "https://modelviewer.dev/shared-assets/models/Astronaut.glb", link: "https://fragment.com" }
            ],
            week: [
                { name: "Golden Crown", collection: "TG Gifts", number: "12", symbol: "👑", backdrop: "Gold Foil", owner: "EQB3...9xL", model3d: "https://modelviewer.dev/shared-assets/models/glTF-Sample-Assets/Models/MaterialsVariantsShoe/glTF-Binary/MaterialsVariantsShoe.glb", link: "https://fragment.com" }
            ],
            month: [
                { name: "Diamond", collection: "TG Gifts", number: "88", symbol: "💎", backdrop: "Soft Blue", owner: "@ton_user", model3d: "https://modelviewer.dev/shared-assets/models/Astronaut.glb", link: "https://fragment.com" }
            ],
            year: [
                { name: "Genesis Gift", collection: "TG Gifts", number: "01", symbol: "🎁", backdrop: "Classic Blue", owner: "@founder", model3d: "https://modelviewer.dev/shared-assets/models/Astronaut.glb", link: "https://fragment.com" }
            ]
        };

        function renderUpgrades(period) {
            const container = document.getElementById('upgrades-list');
            container.innerHTML = '';
            
            const items = upgradeData[period] || [];
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'glass-card';
                card.innerHTML = `
                    <div class="viewer-3d-box">
                        <model-viewer src="${item.model3d}" auto-rotate camera-controls touch-action="pan-y" alt="3D Gift Upgrade"></model-viewer>
                    </div>
                    <div style="font-weight: 800; font-size: 18px;">${item.symbol} ${item.name}</div>
                    <div class="details-grid">
                        <div class="detail-item"><span class="detail-label">Коллекция:</span><span class="detail-value">${item.collection}</span></div>
                        <div class="detail-item"><span class="detail-label">Номер:</span><span class="detail-value">#${item.number}</span></div>
                        <div class="detail-item"><span class="detail-label">Фон:</span><span class="detail-value">${item.backdrop}</span></div>
                        <div class="detail-item"><span class="detail-label">Владелец:</span><span class="detail-value">${item.owner}</span></div>
                    </div>
                    <a href="${item.link}" target="_blank" class="btn-soft-neon">Смотреть на Fragment</a>
                `;
                container.appendChild(card);
            });
        }

        function filterUpgrades(period, btn) {
            document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderUpgrades(period);
        }

        function switchPage(pageId, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

            document.getElementById('page-' + pageId).classList.add('active');
            btn.classList.add('active');

            if(pageId === 'upgrades') renderUpgrades('now');
        }

        renderMarket();
    </script>
</body>
</html>
