<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portals 3D WebGL Gifts</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg: #090d14;
            --card-bg: rgba(21, 31, 46, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #2AABEE;
            --text: #ffffff;
            --subtext: #6c7c93;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 12px;
            padding-bottom: 90px;
            user-select: none;
            overflow-x: hidden;
        }

        .header-title {
            font-size: 22px;
            font-weight: 800;
            margin: 8px 0 16px 4px;
            letter-spacing: -0.5px;
        }

        .gifts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        /* 3D Glassmorphism Card */
        .portals-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.2s;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .portals-card:active {
            transform: scale(0.95);
            border-color: rgba(42, 171, 238, 0.4);
        }

        .canvas-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            position: relative;
            background: radial-gradient(circle at center, rgba(42, 171, 238, 0.1) 0%, transparent 70%);
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        .badge-num {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 10px;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .badge-price {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(42, 171, 238, 0.2);
            border: 1px solid var(--accent);
            color: var(--accent);
            backdrop-filter: blur(8px);
            font-size: 12px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 10px;
            z-index: 10;
        }

        .card-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: rgba(10, 16, 26, 0.6);
            border-top: 1px solid var(--border);
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
        }

        .card-sub {
            font-size: 12px;
            color: var(--subtext);
        }

        /* Fullscreen 3D Sheet Overlay */
        .sheet-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .sheet-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .sheet-content {
            width: 100%;
            max-width: 500px;
            background: #111923;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            padding: 16px 20px 28px 20px;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-top: 1px solid var(--border);
        }

        .sheet-overlay.active .sheet-content {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin: 0 auto 16px auto;
        }

        .modal-canvas-box {
            width: 180px;
            height: 180px;
            margin: 0 auto 16px auto;
            position: relative;
        }

        .sheet-title {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            margin: 0;
        }

        .sheet-sub {
            text-align: center;
            font-size: 13px;
            color: var(--subtext);
            margin: 4px 0 20px 0;
        }

        .btn-action {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            box-shadow: 0 6px 20px rgba(42, 171, 238, 0.4);
        }
    </style>
</head>
<body>

    <div class="header-title">Portals 3D Market</div>
    <div class="gifts-grid" id="gifts-container"></div>

    <!-- 3D Modal Sheet -->
    <div class="sheet-overlay" id="sheet-modal" onclick="closeSheet(event)">
        <div class="sheet-content">
            <div class="sheet-handle"></div>
            <div class="modal-canvas-box" id="modal-3d-box"></div>
            <h3 class="sheet-title" id="modal-title">3D Gift</h3>
            <div class="sheet-sub" id="modal-sub">Collection</div>
            <a href="#" target="_blank" class="btn-action" id="modal-btn">Купить</a>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const giftsData = [
            { name: "Pepe Crown", collection: "Pepe Gifts", number: 88, price: "180 TON", color: 0x059669, shape: "torus" },
            { name: "Cyber Gem", collection: "Electric Skulls", number: 404, price: "310 TON", color: 0x0891b2, shape: "octahedron" },
            { name: "Gold Cube", collection: "Telegram Gifts", number: 12, price: "500 TON", color: 0xd97706, shape: "box" },
            { name: "Mystic Star", collection: "Portals Exclusives", number: 7, price: "950 TON", color: 0x7c3aed, shape: "icosahedron" }
        ];

        const scenes = [];

        function init3DCard(container, itemData) {
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
            camera.position.z = 3.5;

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 1.2);
            pointLight.position.set(5, 5, 5);
            scene.add(pointLight);

            // 3D Mesh Mesh Construction
            let geometry;
            if (itemData.shape === 'torus') geometry = new THREE.TorusGeometry(0.7, 0.25, 16, 100);
            else if (itemData.shape === 'octahedron') geometry = new THREE.OctahedronGeometry(0.9, 0);
            else if (itemData.shape === 'box') geometry = new THREE.BoxGeometry(1, 1, 1);
            else geometry = new THREE.IcosahedronGeometry(0.9, 0);

            const material = new THREE.MeshStandardMaterial({
                color: itemData.color,
                metalness: 0.6,
                roughness: 0.2,
                wireframe: false
            });

            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            // Interactive Rotations
            let isInteracting = false;
            let targetRotX = 0;
            let targetRotY = 0;

            const handleMove = (x, y, rect) => {
                const mouseX = ((x - rect.left) / rect.width) * 2 - 1;
                const mouseY = -((y - rect.top) / rect.height) * 2 + 1;
                targetRotY = mouseX * 1.5;
                targetRotX = -mouseY * 1.5;
            };

            container.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY, container.getBoundingClientRect()));
            container.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    handleMove(e.touches[0].clientX, e.touches[0].clientY, container.getBoundingClientRect());
                }
            });

            const animate = () => {
                requestAnimationFrame(animate);
                mesh.rotation.y += (targetRotY - mesh.rotation.y) * 0.1 + 0.005;
                mesh.rotation.x += (targetRotX - mesh.rotation.x) * 0.1;
                renderer.render(scene, camera);
            };
            animate();
        }

        function renderGrid() {
            const container = document.getElementById('gifts-container');
            container.innerHTML = '';

            giftsData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'portals-card';
                card.onclick = () => openSheet(item);

                card.innerHTML = `
                    <div class="canvas-container" id="canvas-card-${index}">
                        <div class="badge-num">#${item.number}</div>
                        <div class="badge-price">${item.price}</div>
                    </div>
                    <div class="card-info">
                        <div class="card-title">${item.name}</div>
                        <div class="card-sub">${item.collection}</div>
                    </div>
                `;
                container.appendChild(card);

                setTimeout(() => {
                    init3DCard(document.getElementById(`canvas-card-${index}`), item);
                }, 50);
            });
        }

        function openSheet(item) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            document.getElementById('modal-title').innerText = item.name;
            document.getElementById('modal-sub').innerText = item.collection + " • #" + item.number;
            document.getElementById('modal-btn').innerText = "Купить за " + item.price;

            const box = document.getElementById('modal-3d-box');
            box.innerHTML = '';
            init3DCard(box, item);

            document.getElementById('sheet-modal').classList.add('active');
        }

        function closeSheet(e) {
            if (e.target.id === 'sheet-modal' || e.target.className === 'sheet-handle') {
                document.getElementById('sheet-modal').classList.remove('active');
            }
        }

        renderGrid();
    </script>
</body>
</html>
