<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Telegram Gifts Explorer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключение Lottie для оригинальных 3D-анимаций подарков Telegram -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>

    <style>
        :root {
            --bg-color: #0c1829;
            --card-bg: rgba(18, 38, 66, 0.65);
            --glass-border: rgba(56, 189, 248, 0.25);
            --neon-blue: #38bdf8;
            --neon-glow: 0 0 16px rgba(56, 189, 248, 0.4);
            --text-main: #f0f9ff;
            --text-sub: #93c5fd;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at top, #0f243f 0%, #08101d 100%);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            padding-bottom: 90px;
            min-height: 100vh;
        }

        .header { margin-bottom: 16px; }
        .title { font-size: 22px; font-weight: 800; margin: 0; color: #ffffff; text-shadow: var(--neon-glow); }

        .page { display: none; }
        .page.active { display: block; }

        /* Фильтры времени */
        .filter-scroll {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 16px; scrollbar-width: none;
        }
        .filter-scroll::-webkit-scrollbar { display: none; }
        .filter-chip {
            background: rgba(56, 189, 248, 0.08); border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px); color: var(--text-sub); padding: 8px 16px;
            border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer;
        }
        .filter-chip.active {
            background: rgba(56, 189, 248, 0.25); border-color: var(--neon-blue); color: #fff; box-shadow: var(--neon-glow);
        }

        /* Сетка подарков в стиле Telegram */
        .gifts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        /* Карточка подарка в стиле Telegram */
        .tg-gift-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 12px;
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .tg-gift-card:active {
            transform: scale(0.96);
            border-color: var(--neon-blue);
        }

        .badge-number {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--neon-blue);
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .badge-price {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .gift-avatar {
            width: 100px;
            height: 100px;
            margin: 18px 0 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
        }

        .gift-card-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
            text-align: center;
        }

        .gift-card-sub {
            font-size: 11px;
            color: var(--text-sub);
            text-align: center;
        }

        /* Модальное окно (Показывает подробную инфу при клике) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(12px);
            display: none; justify-content: center; align-items: flex-end; z-index: 2000;
        }
        .modal-overlay.active { display: flex; }

        .modal-sheet {
            background: #0d1e36;
            border: 1px solid var(--glass-border);
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            width: 100%;
            padding: 24px 20px;
            box-shadow: 0 -10px 35px rgba(0, 0, 0, 0.6);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-icon {
            font-size: 70px;
            text-align: center;
            margin-bottom: 10px;
        }

        .details-list {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 12px 16px;
            margin: 16px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        .detail-label { color: var(--text-sub); }
        .detail-val { font-weight: 700; color: #fff; }

        .btn-action {
            display: block;
            text-align: center;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 14px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 700;
            box-shadow: var(--neon-glow);
        }

        .btn-close {
            background: none; border: none; color: var(--text-sub);
            width: 100%; padding: 10px; margin-top: 8px; font-weight: 600; cursor: pointer;
        }

        /* Профиль */
        .profile-box { text-align: center; padding: 24px 16px; background: var(--card-bg); border-radius: 20px; border: 1px solid var(--glass-border); }
        .avatar {
            width: 80px; height: 80px; border-radius: 50%; background: rgba(56, 189, 248, 0.15);
            border: 2px solid var(--neon-blue); box-shadow: var(--neon-glow);
            margin: 0 auto 12px auto; display: flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: bold; color: var(--neon-blue);
        }

        /* Нижнее меню */
        .bottom-nav {
            position: fixed; bottom: 12px; left: 16px; right: 16px; height: 64px;
            background: rgba(12, 24, 41, 0.8); backdrop-filter: blur(20px);
            border-radius: 24px; display: flex; justify-content: space-around; align-items: center;
            border: 1px solid var(--glass-border); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); z-index: 1000;
        }

        .nav-btn {
            background: none; border: none; color: var(--text-sub); font-size: 11px;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            cursor: pointer; width: 33%; transition: all 0.2s ease;
        }

        .nav-btn.active { color: var(--neon-blue); font-weight: 700; text-shadow: var(--neon-glow); }
    </style>
</head>
<body>

    <!-- Вкладка 1: Торговые площадки -->
    <div id="page-market" class="page active">
        <div class="header"><h1 class="title">🛒 Торговые Площадки</h1></div>
        <div class="gifts-grid" id="market-grid"></div>
    </div>

    <!-- Вкладка 2: Апгрейды -->
    <div id="page-upgrades" class="page">
        <div class="header"><h1 class="title">⚡️ История Апгрейдов</h1></div>

        <div class="filter-scroll">
            <button class="filter-chip active" onclick="filterUpgrades('now', this)">⚡️ Только что</button>
            <button class="filter-chip" onclick="filterUpgrades('week', this)">📅 Неделю назад</button>
            <button class="filter-chip" onclick="filterUpgrades('month', this)">🗓 Месяц назад</button>
            <button class="filter-chip" onclick="filterUpgrades('year', this)">⏳ Год назад</button>
        </div>

        <div class="gifts-grid" id="upgrades-grid"></div>
    </div>

    <!-- Вкладка 3: Профиль -->
    <div id="page-profile" class="page">
        <div class="header"><h1 class="title">👤 Профиль</h1></div>
        <div class="profile-box">
            <div class="avatar" id="user-avatar">?</div>
            <h2 id="user-name" style="margin: 0 0 6px 0; font-size: 20px;">Пользователь</h2>
            <p id="user-id" style="color: var(--text-sub); margin: 0; font-size: 13px;"></p>
        </div>
    </div>

    <!-- Всплывающее окно информации о подарке -->
    <div class="modal-overlay" id="info-modal">
        <div class="modal-sheet">
            <div class="modal-icon" id="modal-icon">🎁</div>
            <h2 style="text-align: center; margin: 0;" id="modal-title">Название Подарка</h2>
            <p style="text-align: center; color: var(--text-sub); margin: 4px 0 0 0; font-size: 13px;" id="modal-collection">Коллекция</p>

            <div class="details-list">
                <div class="detail-row"><span class="detail-label">Имя коллекции:</span><span class="detail-val" id="modal-col-name">—</span></div>
                <div class="detail-row"><span class="detail-label">Название модели:</span><span class="detail-val" id="modal-model">—</span></div>
                <div class="detail-row"><span class="detail-label">Название фона:</span><span class="detail-val" id="modal-backdrop">—</span></div>
                <div class="detail-row"><span class="detail-label">Название символа:</span><span class="detail-val" id="modal-symbol">—</span></div>
                <div class="detail-row"><span class="detail-label">Номер подарка:</span><span class="detail-val" id="modal-number">—</span></div>
                <div class="detail-row"><span class="detail-label" id="modal-extra-label">Стоимость:</span><span class="detail-val" id="modal-extra-val">—</span></div>
            </div>

            <a href="#" target="_blank" class="btn-action" id="modal-btn">Перейти</a>
            <button class="btn-close" onclick="closeModal()">Закрыть</button>
        </div>
    </div>

    <!-- Нижняя парящая навигация -->
    <div class="bottom-nav">
        <button class="nav-btn active" onclick="switchPage('market', this)">
            <span style="font-size:20px;">🛍</span>
            <span>Маркеты</span>
        </button>
        <button class="nav-btn" onclick="switchPage('upgrades', this)">
            <span style="font-size:20px;">⚡️</span>
            <span>Апгрейды</span>
        </button>
        <button class="nav-btn" onclick="switchPage('profile', this)">
            <span style="font-size:20px;">👤</span>
            <span>Профиль</span>
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('user-name').innerText = user.first_name + (user.last_name ? ' ' + user.last_name : '');
            document.getElementById('user-id').innerText = 'ID: ' + user.id;
            document.getElementById('user-avatar').innerText = user.first_name.charAt(0).toUpperCase();
        }

        // Данные подарков с маркетплейсов
        const marketGifts = [
            { name: "Plush Bear", collection: "Telegram Gifts", number: "1024", symbol: "🧸 Медвежонок", backdrop: "Небесно-голубой Неон", model: "Soft Plush", price: "145 TON", platform: "MRKT", icon: "🧸", link: "https://t.me/mrkt" },
            { name: "Sparks", collection: "Telegram Gifts", number: "512", symbol: "✨ Искры", backdrop: "Глубокий Космос", model: "Cyber Spark", price: "89 TON", platform: "Portals", icon: "✨", link: "https://t.me/portals" },
            { name: "Red Star", collection: "Telegram Gifts", number: "42", symbol: "⭐ Звезда", backdrop: "Золотое Сияние", model: "Ruby Star", price: "320 TON", platform: "Tunnel", icon: "⭐", link: "https://t.me/tunnel" },
            { name: "Diamond", collection: "Telegram Gifts", number: "88", symbol: "💎 Алмаз", backdrop: "Алмазная Пыль", model: "Crystal V2", price: "500 TON", platform: "MRKT", icon: "💎", link: "https://t.me/mrkt" }
        ];

        // Отрисовка сетки маркетов
        function renderMarket() {
            const container = document.getElementById('market-grid');
            container.innerHTML = '';

            marketGifts.forEach(item => {
                const card = document.createElement('div');
                card.className = 'tg-gift-card';
                card.onclick = () => openModal(item, 'price');
                card.innerHTML = `
                    <div class="badge-number">#${item.number}</div>
                    <div class="badge-price">${item.price}</div>
                    <div class="gift-avatar">${item.icon}</div>
                    <div class="gift-card-title">${item.name}</div>
                    <div class="gift-card-sub">${item.model} • ${item.platform}</div>
                `;
                container.appendChild(card);
            });
        }

        // История улучшений
        const upgradeData = {
            now: [
                { name: "Cyber Skull", collection: "Telegram Gifts", number: "77", symbol: "💀 Череп", backdrop: "Электрик Синий", model: "Cyberpunk 2077", owner: "@durov", icon: "💀", link: "https://fragment.com" }
            ],
            week: [
                { name: "Golden Crown", collection: "Telegram Gifts", number: "12", symbol: "👑 Корона", backdrop: "Золотой Глянцевый", model: "Royal Gold", owner: "EQB3...9xL", icon: "👑", link: "https://fragment.com" }
            ],
            month: [
                { name: "Magic Cap", collection: "Telegram Gifts", number: "304", symbol: "🧢 Кепка", backdrop: "Темно-синий", model: "Classic Durov", owner: "@telegram", icon: "🧢", link: "https://fragment.com" }
            ],
            year: [
                { name: "Genesis Gift", collection: "Telegram Gifts", number: "01", symbol: "🎁 Первенец", backdrop: "Классический TON", model: "Original #1", owner: "@founder", icon: "🎁", link: "https://fragment.com" }
            ]
        };

        function renderUpgrades(period) {
            const container = document.getElementById('upgrades-grid');
            container.innerHTML = '';
            
            const items = upgradeData[period] || [];
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'tg-gift-card';
                card.onclick = () => openModal(item, 'owner');
                card.innerHTML = `
                    <div class="badge-number">#${item.number}</div>
                    <div class="gift-avatar">${item.icon}</div>
                    <div class="gift-card-title">${item.name}</div>
                    <div class="gift-card-sub">Владелец: ${item.owner}</div>
                `;
                container.appendChild(card);
            });
        }

        // Открытие всплывающей карточки с подробной инфой
        function openModal(item, type) {
            document.getElementById('modal-icon').innerText = item.icon;
            document.getElementById('modal-title').innerText = item.name;
            document.getElementById('modal-collection').innerText = item.collection;

            document.getElementById('modal-col-name').innerText = item.collection;
            document.getElementById('modal-model').innerText = item.model;
            document.getElementById('modal-backdrop').innerText = item.backdrop;
            document.getElementById('modal-symbol').innerText = item.symbol;
            document.getElementById('modal-number').innerText = "#" + item.number;

            if (type === 'price') {
                document.getElementById('modal-extra-label').innerText = "Стоимость:";
                document.getElementById('modal-extra-val').innerText = item.price + " (" + item.platform + ")";
                document.getElementById('modal-btn').innerText = "Купить на " + item.platform;
            } else {
                document.getElementById('modal-extra-label').innerText = "Владелец:";
                document.getElementById('modal-extra-val').innerText = item.owner;
                document.getElementById('modal-btn').innerText = "Смотреть на Fragment";
            }

            document.getElementById('modal-btn').href = item.link;
            document.getElementById('info-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('info-modal').classList.remove('active');
        }

        function filterUpgrades(period, btn) {
            document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderUpgrades(period);
        }

        function switchPage(pageId, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

            document.getElementById('page-' + pageId).classList.add('active');
            btn.classList.add('active');

            if(pageId === 'upgrades') renderUpgrades('now');
        }

        renderMarket();
    </script>
</body>
</html>
